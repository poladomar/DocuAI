<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocuAI</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eef2ff;color:#1e293b}main{max-width:900px;margin:auto;padding:32px}h1{color:#4338ca}section{background:white;border-radius:16px;padding:25px;margin:18px 0}input,textarea,button{font:inherit}input[type=file]{max-width:100%;padding:16px 0}textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;resize:vertical}button{border:0;background:#4338ca;color:white;border-radius:9px;padding:12px 24px;cursor:pointer;margin-top:14px}button:disabled{opacity:.5}article{border-left:3px solid #818cf8;padding:12px 20px;background:#f8fafc;margin:12px 0}p{line-height:1.6;white-space:pre-wrap}small{color:#64748b}#status{color:#4338ca}
</style></head><body><main><h1>DocuAI</h1><p>Ask questions about your documents and find the evidence.</p><section><form id="form"><label>Document (PDF or TXT, 10 MB maximum)<br><input type="file" name="file" accept=".pdf,.txt" required></label><p><label for="question">Your question</label></p><textarea id="question" name="question" rows="3" maxlength="1000" required placeholder="What are the main findings?"></textarea><p><label><input name="use_ai" type="checkbox" value="true"> Generate an AI answer (sends relevant excerpts to the configured API provider)</label></p><small>Without AI mode, search takes place locally and requires no API key.</small><br><button id="ask">Find answer</button></form><p id="status" role="status"></p></section><section><h2>Answer</h2><p id="answer">Upload a document to begin.</p><h2>Source passages</h2><div id="sources"></div></section></main><script>
const $=id=>document.getElementById(id);
$("form").onsubmit=async e=>{e.preventDefault();$("ask").disabled=true;$("status").textContent="Searching document…";$("sources").replaceChildren();$("answer").textContent="";
try{const r=await fetch("/api/ask",{method:"POST",body:new FormData(e.target)}),data=await r.json();if(!r.ok)throw Error(typeof data.detail==="string"?data.detail:"Request failed");$("answer").textContent=data.answer;for(const c of data.matches){const article=document.createElement("article"),label=document.createElement("strong"),text=document.createElement("p");label.textContent="Page "+c.page;text.textContent=c.text;article.append(label,text);$("sources").append(article)}$("status").textContent=data.generated?"AI answer generated":"Local search complete"}catch(e){$("status").textContent=e.message}finally{$("ask").disabled=false}};
</script></body></html>
